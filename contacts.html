<!DOCTYPE html>
<html>
<head>
<title>Contact Us</title>
<style>
body{
    background-color:skyblue;
    font-family:Arial;
}
div{
    background:white;
    width:500px;
    margin:auto;
    margin-top:40px;
    padding:20px;
    border-radius:10px;
}
h1{
    text-align:center;
    color:darkblue;}
input,textarea{
    width:100%;
    margin:8px;
    padding:8px;
}
button{
    background:green;
    color:white;
    border:none;
    padding:10px 20px;
}
</style>
</head>
<body>
<div>
<h1>CONTACT US</h1>
<form>
<label><b>Name</b></label><br>
<input type="text" placeholder="Enter your name">
<label><b>Email</b>
</label><br>
<input type="email" placeholder="Enter your email">
<label><b>Message</b>
</label><br>
<textarea rows="6" placeholder="Write your message">
</textarea><br><br>
<button>Send Message</button>
</form>
</div>
</body>  </html>
